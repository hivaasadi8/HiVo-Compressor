# ╔══════════════════════════════════════════════════════════╗
# ║  ⚡ HiVo Compressor — Auto-Run on GitHub Actions         ║
# ║  🔄 Self-Restarting | 🚀 FFmpeg | 💾 Persistent Data      ║
# ╚══════════════════════════════════════════════════════════╝

name: ⚡ HiVo Compressor Bot

on:
  schedule:
    # هر ۵ ساعت یک بار (چون سقف اجرا ۶ ساعته)
    - cron: '0 */5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'README.md'

# جلوگیری از اجرای همزمان چند نسخه
concurrency:
  group: hivo-compressor
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"
  TERM: "xterm-256color"
  PYTHONUNBUFFERED: "1"
  TEMP_DIR: "/tmp/hivo"

jobs:
  run-bot:
    name: 🤖 Run Telegram Bot
    runs-on: ubuntu-latest
    timeout-minutes: 350      # ~۵ ساعت و ۵۰ دقیقه (زیر سقف ۶ ساعت)
    permissions:
      contents: write          # برای commit کردن data/

    steps:
      # ─────────── 📥 Checkout ───────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────── 🐍 Python ───────────
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ─────────── 🎬 FFmpeg + Tools ───────────
      - name: 🎬 Install FFmpeg & compression tools
        run: |
          echo "::group::📦 Installing system tools"
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg \
            zstd \
            p7zip-full \
            libimage-exiftool-perl \
            webp \
            pngquant \
            jpegoptim
          echo "::endgroup::"
          ffmpeg -version | head -1
          zstd --version

      # ─────────── 📦 Python deps ───────────
      - name: 📦 Install Python dependencies
        run: |
          echo "::group::🐍 Installing pip packages"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "::endgroup::"

      # ─────────── 💾 Restore data cache ───────────
      - name: 💾 Restore user data
        uses: actions/cache@v4
        with:
          path: data/
          key: hivo-data-${{ github.run_id }}
          restore-keys: |
            hivo-data-

      # ─────────── 🚀 Run Bot ───────────
      - name: 🚀 Start HiVo Compressor Bot
        id: bot
        continue-on-error: true
        env:
          BOT_TOKEN:   ${{ secrets.BOT_TOKEN }}
          ADMIN_ID:    ${{ secrets.ADMIN_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:     ${{ github.repository }}
          RUN_ID:      ${{ github.run_id }}
        run: |
          echo "::group::⚡ Bot is starting..."
          # اجرا با محدودیت زمانی داخلی (۵ ساعت ۳۰ دقیقه)
          timeout 19800 python main.py || echo "Bot stopped (timeout or exit)"
          echo "::endgroup::"

      # ─────────── 💾 Commit data changes ───────────
      - name: 💾 Save data to repo
        if: always()
        run: |
          echo "::group::💾 Committing data"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-update data [skip ci]"
            git push || echo "Push failed (maybe no changes)"
          else
            echo "No changes to commit"
          fi
          echo "::endgroup::"

      # ─────────── 🔄 Self Restart ───────────
      - name: 🔄 Schedule next run
        if: always()
        run: |
          echo "::group::🔄 Triggering next run"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "✅ Next run scheduled" \
            || echo "⚠️ Failed to schedule (fallback to cron)"
          echo "::endgroup::"

      # ─────────── 📊 Summary ───────────
      - name: 📊 Job Summary
        if: always()
        run: |
          echo "## ⚡ HiVo Compressor — Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 مرحله | ✅ وضعیت |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---:|" >> $GITHUB_STEP_SUMMARY
          echo "| 📥 Checkout | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎬 FFmpeg install | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 🤖 Bot run | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 💾 Data save | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🕐 **زمان:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
